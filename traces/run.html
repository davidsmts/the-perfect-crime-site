<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Perfect Crime · trace</title>
<meta name="description" content="A selected trial from the paper-results trace-tampering evidence package.">
<link rel="icon" href="../assets/plane-mark.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..700&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=3">
<script src="assets/common.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="../index.html" class="logo">The Perfect Crime</a>
    <a href="index.html" class="logo-sub">/ traces</a>
    <span class="topbar-spacer"></span>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light and dark theme">
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
      </svg>
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="rail">
    <a href="index.html" class="back-link" id="back-link">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to all runs
    </a>
    <div class="card">
      <h1 class="summary-title" id="s-title">—</h1>
      <div class="summary-sub" id="s-sub"></div>

      <div class="verdict-block">
        <div class="verdict-big" id="s-verdict">—</div>
        <div class="verdict-headline" id="s-headline"></div>
      </div>

      <dl class="stats" id="s-stats"></dl>

      <div class="rail-section-label">Run id</div>
      <div class="run-id" id="s-runid" title="Click to copy"><code id="s-runid-text"></code></div>
    </div>
  </aside>

  <main>
    <nav class="tab-nav" role="tablist">
      <button class="tab-btn active" data-tab="trace" role="tab">Run trace</button>
      <button class="tab-btn" data-tab="evidence" role="tab">Trace evidence</button>
      <button class="tab-btn" data-tab="task" role="tab">Task &amp; grading</button>
    </nav>

    <section id="tab-trace" class="section active">
      <header class="toolbar">
        <span id="event-count" class="muted"></span>
        <span class="spacer"></span>
        <div class="seg" role="group" aria-label="Level of detail">
          <button type="button" id="view-focus" class="active">Focus</button>
          <button type="button" id="view-full">Full</button>
        </div>
        <label class="toggle-label"><input type="checkbox" id="expand-outputs"> expand outputs</label>
        <input type="number" id="jump" class="jump" min="1" placeholder="event #" aria-label="Jump to event number">
      </header>
      <div id="trace" class="trace"></div>
    </section>

    <section id="tab-evidence" class="section">
      <div id="evidence"></div>
    </section>

    <section id="tab-task" class="section">
      <div id="task"></div>
    </section>
  </main>
</div>

<script src="assets/run.js"></script>
</body>
</html>
